name: Contribution System

on:
  schedule:
    # Atualiza 4x ao dia para o painel diário acompanhar novas contribuições.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_contribution_system.py"
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate live contribution system
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Luiz-Gabriel01
          TZ: America/Recife
        run: python scripts/generate_contribution_system.py

      - name: Commit updated contribution system
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-system.svg
          if git diff --cached --quiet; then
            echo "No contribution changes to commit."
          else
            git commit -m "chore: refresh contribution system [skip ci]"
            git push
          fi

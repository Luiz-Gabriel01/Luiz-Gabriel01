name: Contribution Galaxy

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Luiz-Gabriel01
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#FFD700&color_dots=#0D1117,#3D3200,#6B5700,#A88700,#FFD700

      - name: Publish generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
